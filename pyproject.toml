[project]
name = "libpcap-py"
version = "0.3.7"
description = "libpcap python wrapper"
readme = "README.md"
authors = [
    { name = "tooosay" }
]
requires-python = ">=3.10"
dependencies = [
    "build>=1.5.1",
]

[build-system]
requires = ["meson-python"]
build-backend = "mesonpy"

[tool.ruff]
line-length = 125
target-version = "py310"

exclude = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "cfg",
  ".github",
  "scripts",
  "out",
  "__pypackages__",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "archived",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"] 

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-v", 
  "--hypothesis-show-statistics",]
testpaths = ["tests"]

faulthandler_timeout = "15"
timeout = "20"
timeout_method = "signal"

markers = [
  "online: requires live capture privileges / network"
]


[dependency-groups]
dev = [
    "clang>=21.1.7",
    "hypothesis>=6.156.6",
    "meson-python>=0.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-randomly>=4.0.1",
    "pytest-sugar>=1.1.1",
    "pytest-timeout>=2.4.0",
    "ruff==0.15.13",
]

