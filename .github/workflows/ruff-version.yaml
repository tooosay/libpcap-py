name: Ruff version parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen --dev    

      - name: Compare ruff versions (nix vs uv)
        run: |
          set -euo pipefail
          nix_ver="$(nix develop -c ruff --version 2>/dev/null | awk '{print $2}')"
          uv_ver="$(nix develop -c uv run ruff --version 2>/dev/null | awk '{print $2}')"
          [[ "${nix_ver}" == "${uv_ver}" ]] || (echo "mismatch nix=${nix_ver} uv=${uv_ver}" && exit 1)