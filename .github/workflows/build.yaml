name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: false
        type: string

permissions:
  contents: write

jobs:
  wheel:
    name: Wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            experimental: false
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install Python
        run: nix develop -c uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Check build environment
        run: |
          nix develop -c uv run python --version
          nix develop -c uv --version
          nix develop -c pkg-config --cflags --libs libpcap
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Build wheel
        run: nix develop -c uv build --wheel
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build sdist
        run: nix develop -c uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish_release_assets:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs:
      - wheel
      - sdist

    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wheel-*
          path: release-dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: release-dist

      - name: List release files
        run: find release-dist -type f -maxdepth 2 -print

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"

          gh release upload "${tag}" release-dist/* --clobber

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ inputs.tag }}"

          gh release edit "${tag}" --draft=false