name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.5"
        required: true
        type: string

  push:
    tags:
      - "v*"

concurrency:
  group: build-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wheel:
    if: startsWith(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, 'v')
    name: Wheel / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: false
          - python-version: "3.15"
            experimental: true

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Install Python
        run: nix develop -c uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: nix develop -c uv sync --frozen --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Check build environment
        run: |
          nix develop -c uv run python --version
          nix develop -c uv --version
          nix develop -c pkg-config --cflags --libs libpcap
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          rm -rf dist build
          nix develop -c uv build --wheel
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    if: startsWith(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, 'v')
    name: Source distribution
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Build sdist
        run: |
          rm -rf dist build
          nix develop -c uv build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release-assets:
    if: startsWith(github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name, 'v')
    name: Publish release assets
    runs-on: ubuntu-latest

    needs:
      - wheel
      - sdist

    permissions:
      contents: write

    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: release-dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: release-dist

      - name: List release files
        run: find release-dist -type f -maxdepth 2 -print

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --draft \
              --generate-notes
          fi

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" release-dist/* --repo "${REPO}" --clobber

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --repo "${REPO}" --draft=false