name: format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main , dev ]

jobs:
  nix-fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Nix checks (includes formatting if wired via treefmt-nix)
        run: nix flake check