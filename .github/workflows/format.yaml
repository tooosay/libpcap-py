name: Format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main , dev ]

jobs:
  nix-fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-nix
      - name: Nix checks (includes formatting if wired via treefmt-nix)
        run: nix flake check